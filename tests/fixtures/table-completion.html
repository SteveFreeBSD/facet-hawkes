  Lesson 2.1, the table-completion question for x = y^2.

  Modelled on the live page observed on 2026-09-07 (run rmtraz84kec53). What is
  taken from that observation rather than imagined: the question is
  `x = y^2`, the table has five blank cells, all five answer boxes are visible,
  enabled and uniquely identified, the focused box's id was
  `MatrixTextBoxes3_num`, and each box publishes `[0-9-]` with a maximum of
  four characters -- so every answer here is a signed integer even though two
  of the *given* cells are exact radicals.

  The per-box numbering is modelled: the live evidence counted five boxes and,
  because it counted more than four, reported no ids at all. That is the fault
  this fixture exists for.

  The instruction wording is modelled too. The live run reported only its
  length -- 123 characters -- and that a prompt was found at all, which means
  the real sentence carries a verb the probe recognises. The wording below is
  written to do the same; "complete" on its own is not in that list.

  The table is the answer surface, which is why the question probe reports
  `no-data-table` for it: a data table is a table the question states its
  numbers in, and this one holds the controls the answer is typed into.
-->
