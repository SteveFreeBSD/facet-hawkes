<!doctype html><meta charset="utf-8"><title>plot fixture</title>
<div id="questionDescription">Plot the following points in the Cartesian plane.</div>
<div id="questionString">{(7,4),(-8,4),(-6,-1),(6,-10)}</div>
<div id="partInformation">Question 1 of 8, Step 1 of 1</div>
<div id="QGraph" role="application">
  <svg width="420" height="420">
    <defs><clipPath id="cp"><rect width="400" height="400"/></clipPath></defs>
    <g id="controls"></g>
  </svg>
</div>
<script>
// Four draggable point controls on a -10..10 grid, snap 1. Every one starts at
// the origin, which is how Hawkes hands a plotting question over.
const points = [0,1,2,3].map(i => ({ID: "P"+i, title: "Point "+(i+1), x: 0, y: 0, snapX: 1, snapY: 1}));
const g = document.getElementById("controls");
const NS = "http://www.w3.org/2000/svg";
window.graphEvents = []; window.forbiddenEvents = []; const committed = new Set();
window.committedPoints = () => points.filter(p => committed.has(p.ID)).map(p => [p.x, p.y]);
points.forEach((p, i) => {
  const a = document.createElementNS(NS, "a");
  a.id = "anchor-" + p.ID;
  a.setAttribute("draggable", "true");
  a.setAttribute("role", "button");
  a.setAttribute("aria-labelledby", "label-" + i);
  a.setAttribute("tabindex", "0");
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("r", "5");
  a.appendChild(c);
  g.appendChild(a);
  const label = document.createElement("span");
  label.id = "label-" + i; label.textContent = p.title;
  document.body.appendChild(label);
  a.addEventListener("blur", () => { if (p.moved) committed.add(p.ID); });
  a.addEventListener("keydown", (event) => {
    const step = ({ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]})[event.code];
    if (["Enter","Tab"," "].includes(event.key)) window.forbiddenEvents.push(event.key);
    if (!step) return;
    p.x += step[0] * p.snapX; p.y += step[1] * p.snapY; p.moved = true;
    window.graphEvents.push({i, key: event.code});
    paint();
  });
});
function paint() {
  points.forEach((p, i) => {
    const c = g.children[i].querySelector("circle");
    c.setAttribute("cx", String(200 + p.x * 20));
    c.setAttribute("cy", String(200 - p.y * 20));
  });
}
window.quant_wp_UI = {controlsCollection: [{
  isGraph: true,
  getEnableState: () => true,
  allGraphObjects: () => points,
  graphXML: () => '<graph><grid><type>cartesian</type><cartesian><xmin>-10</xmin><xmax>10</xmax><ymin>-10</ymin><ymax>10</ymax></cartesian></grid></graph>',
  userAnswer: () => '<graph>' + points.map(p => `<point><x>${p.x}</x><y>${p.y}</y></point>`).join("") + '</graph>',
}]};
paint();
</script>
