[project]
name = "ethnos"
version = "0.1.0"
description = "Local-first PDF study, quiz, and agent-review system with auditable Ollama workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.0",
    "pydantic>=2.11.0",
    "pymupdf>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "vulture>=2.14",
]

[project.scripts]
ethnos = "ethnos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
