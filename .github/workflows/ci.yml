name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Ethnos calls Facet's exact solvers, and facet-runtime needs 3.12.
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: facet-hawkes
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-hawkes
      # The exact solvers live in Facet and are a path dependency of this
      # package, so the sibling checkout is part of installing it at all.
      - uses: actions/checkout@v6
        with:
          repository: SteveFreeBSD/facet-runtime
          path: facet-runtime
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Dead code audit
        run: uv run vulture src tests --min-confidence 80
      - name: Test
        run: uv run pytest -q
